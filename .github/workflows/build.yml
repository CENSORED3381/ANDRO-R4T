name: build-apk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34"

      - name: Set up Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found. Generating it..."

            GRADLE_VERSION="8.4"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
              --gradle-version "$GRADLE_VERSION"
          fi

          chmod +x gradlew

      - name: Diagnose Kotlin dependency conflict
        run: |
          echo "===== kotlin-stdlib-jdk8 ====="

          ./gradlew :app:dependencyInsight \
            --dependency kotlin-stdlib-jdk8 \
            --configuration debugRuntimeClasspath \
            --no-daemon

          echo "===== kotlin-stdlib ====="

          ./gradlew :app:dependencyInsight \
            --dependency kotlin-stdlib \
            --configuration debugRuntimeClasspath \
            --no-daemon

      - name: Compile Java with detailed diagnostics
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          ./gradlew :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace \
            --info

      - name: Build Debug APK
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
