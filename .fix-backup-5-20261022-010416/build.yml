name: build-apk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34"

      - name: Set up Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found. Generating it..."

            GRADLE_VERSION="8.4"

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
              --gradle-version "$GRADLE_VERSION"
          fi

          chmod +x gradlew

      - name: Diagnose Kotlin dependencies
        continue-on-error: false
        run: |
          mkdir -p diagnostics

          ./gradlew :app:dependencyInsight \
            --dependency kotlin-stdlib-jdk8 \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            > diagnostics/kotlin-jdk8.log 2>&1 || true

          ./gradlew :app:dependencyInsight \
            --dependency kotlin-stdlib \
            --configuration debugRuntimeClasspath \
            --no-daemon \
            > diagnostics/kotlin-stdlib.log 2>&1 || true

      - name: Build Debug APK
        id: build_apk
        continue-on-error: false
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          mkdir -p diagnostics

          set +e
          ./gradlew assembleDebug \ || exit 1
            --no-daemon \
            --stacktrace \
            --info \
            > diagnostics/apk-build.log 2>&1

          RESULT=$?
          set -e

          echo "exit_code=$RESULT" >> "$GITHUB_OUTPUT"

          echo "===== Build error summary ====="
          grep -n -B 8 -A 15 -E \
            'error:|What went wrong:|Duplicate class|Could not resolve|Compilation failed' \
            diagnostics/apk-build.log | head -n 200 || true

          tail -n 60 diagnostics/apk-build.log || true

          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn

      - name: Upload APK artifact
        if: steps.build_apk.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail workflow if APK build failed
        if: always() && steps.build_apk.outputs.exit_code != '0'
        run: |
          echo "The Android APK build failed."
          echo "Download android-build-diagnostics to inspect the logs."
          exit 1
